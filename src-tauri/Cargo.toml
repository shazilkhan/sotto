[package]
name = "sotto"
version = "0.1.0"
description = "Push-to-talk dictation for Windows that runs fully on your machine"
edition = "2021"
publish = false

[dependencies]
cpal = "0.18.2"
log = "0.4.34"
# transcribe-rs 0.3.12 accepts ^2.0.0-rc.12 but fails to build against rc.14+.
ort = "=2.0.0-rc.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
transcribe-rs = { version = "0.3.12", features = ["onnx"] }
ureq = "3.5.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_Multimedia", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
